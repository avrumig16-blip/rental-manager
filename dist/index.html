function b64ToArrayBuffer(b64){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer}
function nlDate(v){if(!v)return "";const d=new Date(v+"T12:00:00");return d.toLocaleDateString("nl-BE",{day:"2-digit",month:"2-digit",year:"numeric"})}
function leaseDurationText(a,b){if(!a||!b)return "";const s=new Date(a+"T12:00:00"),e=new Date(b+"T12:00:00");let m=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());if(e.getDate()<s.getDate())m--;if(m<=0)return "de overeengekomen termijn";const y=Math.floor(m/12),r=m%12;return [y?`${y} jaar`:"",r?`${r} maand${r===1?"":"en"}`:""].filter(Boolean).join(" en ")}
function nlMonth(v){if(!v)return "";return new Date(v+"T12:00:00").toLocaleDateString("nl-BE",{month:"long"})}
function numWordsNl(n){n=Math.round(Number(n||0));const o=["nul","een","twee","drie","vier","vijf","zes","zeven","acht","negen","tien","elf","twaalf","dertien","veertien","vijftien","zestien","zeventien","achttien","negentien"],t=["","","twintig","dertig","veertig","vijftig","zestig","zeventig","tachtig","negentig"];if(n<20)return o[n];if(n<100){const a=n%10;return a?`${o[a]}en${t[Math.floor(n/10)]}`:t[Math.floor(n/10)]}if(n<1000){const h=Math.floor(n/100),r=n%100;return `${h===1?"honderd":o[h]+"honderd"}${r?" "+numWordsNl(r):""}`}if(n<1000000){const k=Math.floor(n/1000),r=n%1000;return `${k===1?"duizend":numWordsNl(k)+"duizend"}${r?" "+numWordsNl(r):""}`}return String(n)}

 const ownerTenantIds=ownerId?new Set((()=>{const bids=new Set(db.buildings.filter(b=>String(b.owner_id)===String(ownerId)).map(b=>String(b.id))),uids=new Set(db.units.filter(u=>bids.has(String(u.building_id))).map(u=>String(u.id)));return db.tenants.filter(t=>unitsForTenant(db,t.id).some(u=>uids.has(String(u.id)))).map(t=>String(t.id))})()):null;

 const[statusFilter,setStatusFilter]=useState("all"),[monthFilter,setMonthFilter]=useState(""),[search,setSearch]=useState("");

 const[openYears,setOpenYears]=useState(()=>({[currentYear]:true}));

 const statusFor=p=>{const paid=paidTotal(p.id),adjustments=adjustmentNetForPayment(db,p.id),due=Number(p.expected_amount||0),balance=Math.max(0,due+adjustments-paid);return balance<=0?"paid":paid>0||adjustmentsForPayment(db,p.id).length>0?"partial":"unpaid"};
 const filtered=rows.filter(p=>{const t=db.tenants.find(x=>x.id===p.tenant_id),st=statusFor(p),mk=`${p.year}-${String(p.month).padStart(2,"0")}`;return(statusFilter==="all"||st===statusFilter)&&(!monthFilter||mk===monthFilter)&&(!search||String(t?.name||"").toLowerCase().includes(search.toLowerCase()))});
 const years=filtered.reduce((acc,p)=>{if(!acc[p.year])acc[p.year]={};const k=`${p.year}-${String(p.month).padStart(2,"0")}`;(acc[p.year][k]||(acc[p.year][k]=[])).push(p);return acc},{});
 const currentKey=`${currentYear}-${String(currentMonth).padStart(2,"0")}`;

function normalizeMatchText(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function makeTenantReference(){const a=Math.random().toString(36).slice(2,6).toUpperCase(),b=String(Math.floor(1000+Math.random()*9000));return `PM-${a}-${b}`}
function bankTenantSuggestion(db,t){

 const candidates=(db.tenants||[]).map(tenant=>{
  let score=0,reasons=[];const name=normalizeMatchText(tenant.name),iban=cleanIban(tenant.iban||"").toLowerCase(),ref=normalizeMatchText(tenant.payment_reference);
  if(ref&&compact.includes(ref)){score+=14;reasons.push("Reference")}
  if(iban&&txIban&&iban===txIban){score+=10;reasons.push("IBAN")}
  else if(iban&&normalizeMatchText(text).includes(normalizeMatchText(iban))){score+=9;reasons.push("IBAN")}
  if(name&&compact.includes(name)){score+=6;reasons.push("Name")}
  else if(name&&String(t.counterparty_name||"").toLowerCase().split(/\s+/).filter(x=>x.length>2).filter(x=>String(tenant.name||"").toLowerCase().includes(x)).length>=2){score+=4;reasons.push("Name close")}
  const payments=(db.payments||[]).filter(p=>String(p.tenant_id)===String(tenant.id)&&validMonth(p));
  const open=payments.filter(p=>{const paid=(db.payment_entries||[]).filter(e=>String(e.payment_id)===String(p.id)).reduce((a,x)=>a+Number(x.amount||0),0);return Number(p.expected_amount||0)+adjustmentNetForPayment(db,p.id)-paid>0.005}).sort((a,b)=>(a.year-b.year)||(a.month-b.month));
  const payment=open[0];if(payment){const paid=(db.payment_entries||[]).filter(e=>String(e.payment_id)===String(payment.id)).reduce((a,x)=>a+Number(x.amount||0),0),due=Math.max(0,Number(payment.expected_amount||0)+adjustmentNetForPayment(db,payment.id)-paid);if(Math.abs(Number(t.amount)-due)<0.01){score+=4;reasons.push("Amount")}}
  const confidence=Math.min(99,Math.round(score/34*100));return{tenant,payment,score,reasons,confidence};

function TenantUnitsPicker({db,unitIds,toggle}){

 function toggleBuilding(id){
  setOpen(x=>({...x,[id]:!x[id]}));

  .filter(b=>db.units.some(u=>u.building_id===b.id&&unitIds.includes(u.id)))
  .map(b=>b.id);

  ?db.buildings
  :db.buildings.filter(b=>selectedBuildingIds.includes(b.id));

     <input type="checkbox" checked={unitIds.includes(u.id)} onChange={()=>toggle(u.id)}/>

   </div>}
  </div>
 }

 return <div className="unit-picker">

  {visibleBuildings.length
   ?visibleBuildings.map(b=><BuildingGroup key={b.id} b={b}/>)

  {db.buildings.length>selectedBuildingIds.length&&

    {showOther?"Hide other buildings":"+ Add units from another building"}
   </button>}
 </div>
}

function tenantsForUnit(db,id){let ids=db.tenant_units.filter(x=>String(x.unit_id)===String(id)).map(x=>x.tenant_id);return db.tenants.filter(t=>ids.includes(t.id)||String(t.unit_id)===String(id))}
function unitLabel(db,u){let b=db.buildings.find(x=>x.id===u.building_id);return `${b?.name||"Building"} - ${u.unit_number||"Unit"}`}
function Card({l,v}){return <div className="card"><small>{l}</small><b>{v}</b></div>}function Panel({title,children}){return <div className="panel"><div className="panel-head"><h3>{title}</h3></div><div className="panel-body">{children}</div></div>}function List({title,add,children}){return <div className="panel directory-list"><div className="panel-head"><div><h3>{title}</h3><small style={{color:"#8291a4",fontSize:10}}>Manage and open {String(title||"").toLowerCase()} records</small></div><button className="primary" onClick={add}>+ Add</button></div>{React.Children.count(children)?children:<div className="empty">Nothing yet.</div>}</div>}function Row({t,s,onClick}){return <div className="directory-row" onClick={onClick}><div className="directory-row-main"><b>{t}</b><span>{s}</span></div><div className="directory-row-arrow">›</div></div>}function Tile({t,s,onClick}){return <div className="tile" onClick={onClick}><b>{t}</b><br/>{s}</div>}
createRoot(document.getElementById("root")).render(<App/>);
</script>
