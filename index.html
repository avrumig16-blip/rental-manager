function b64ToArrayBuffer(b64){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer}
function nlDate(v){if(!v)return "";const d=new Date(v+"T12:00:00");return d.toLocaleDateString("nl-BE",{day:"2-digit",month:"2-digit",year:"numeric"})}
function leaseDurationText(a,b){if(!a||!b)return "";const s=new Date(a+"T12:00:00"),e=new Date(b+"T12:00:00");let m=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());if(e.getDate()<s.getDate())m--;if(m<=0)return "de overeengekomen termijn";const y=Math.floor(m/12),r=m%12;return [y?`${y} jaar`:"",r?`${r} maand${r===1?"":"en"}`:""].filter(Boolean).join(" en ")}
function nlMonth(v){if(!v)return "";return new Date(v+"T12:00:00").toLocaleDateString("nl-BE",{month:"long"})}
function numWordsNl(n){n=Math.round(Number(n||0));const o=["nul","een","twee","drie","vier","vijf","zes","zeven","acht","negen","tien","elf","twaalf","dertien","veertien","vijftien","zestien","zeventien","achttien","negentien"],t=["","","twintig","dertig","veertig","vijftig","zestig","zeventig","tachtig","negentig"];if(n<20)return o[n];if(n<100){const a=n%10;return a?`${o[a]}en${t[Math.floor(n/10)]}`:t[Math.floor(n/10)]}if(n<1000){const h=Math.floor(n/100),r=n%100;return `${h===1?"honderd":o[h]+"honderd"}${r?" "+numWordsNl(r):""}`}if(n<1000000){const k=Math.floor(n/1000),r=n%1000;return `${k===1?"duizend":numWordsNl(k)+"duizend"}${r?" "+numWordsNl(r):""}`}return String(n)}

const blank={owners:[],owner_bank_accounts:[],buildings:[],units:[],tenants:[],tenant_units:[],payments:[],payment_entries:[],tenant_adjustments:[],utility_ean_codes:[],meter_readings:[],utility_tariffs:[],contract_intakes:[],bank_connections:[],bank_accounts:[],bank_transactions:[]};
const eur=n=>new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR"}).format(Number(n||0));
const money=t=>Number(t?.base_rent??t?.rent??0)+Number(t?.additional_costs??0);
const validMonth=p=>Number(p?.year)>=2000&&Number(p?.month)>=1&&Number(p?.month)<=12;
const monthLabel=p=>validMonth(p)?new Date(Number(p.year),Number(p.month)-1,1).toLocaleString("en-GB",{month:"short",year:"numeric"}):"Invalid month";
const monthLongLabel=p=>validMonth(p)?new Date(Number(p.year),Number(p.month)-1,1).toLocaleString("en-GB",{month:"long",year:"numeric"}):"Invalid month";
const tableForType=type=>({owner:"owners",building:"buildings",unit:"units",tenant:"tenants",payment:"payments",adjustment:"tenant_adjustments",utility:"utility_ean_codes"}[type]||`${type}s`);
const adjustmentsForPayment=(db,id)=>db.tenant_adjustments.filter(x=>String(x.payment_id)===String(id)&&x.status!=="rejected");
const adjustmentNetForPayment=(db,id)=>adjustmentsForPayment(db,id).reduce((s,x)=>s+(x.adjustment_type==="charge"?Number(x.amount||0):-Number(x.amount||0)),0);
const creditTotalForPayment=(db,id)=>adjustmentsForPayment(db,id).filter(x=>x.adjustment_type!=="charge").reduce((s,x)=>s+Number(x.amount||0),0);
const chargeTotalForPayment=(db,id)=>adjustmentsForPayment(db,id).filter(x=>x.adjustment_type==="charge").reduce((s,x)=>s+Number(x.amount||0),0);

function App(){
 const[session,setSession]=useState(null),[db,setDb]=useState(blank),[page,setPage]=useState("dashboard"),[modal,setModal]=useState(null),[q,setQ]=useState("");
 useEffect(()=>{sb.auth.getSession().then(({data})=>{setSession(data.session);if(data.session)load()});const{data}=sb.auth.onAuthStateChange((_e,s)=>{setSession(s);if(s)load()});return()=>data.subscription.unsubscribe()},[]);
 async function load(){const names=Object.keys(blank);const results=await Promise.all(names.map(async t=>{const r=await sb.from(t).select("*").order("id");return{table:t,...r}}));setDb(current=>{const next={...current};const errors=[];results.forEach(r=>{if(r.error){errors.push(`${r.table}: ${r.error.message}`)}else{next[r.table]=r.data||[]}});if(errors.length){console.error("Property Manager load errors",errors);setTimeout(()=>alert("Some data could not be loaded. Existing records were NOT deleted.\n\n"+errors.join("\n")),0)}return next})}
 if(!session)return <Login/>;
 return <div className="app"><aside><div className="brand"><div className="logo">🏠</div><div><h2>Property Manager Pro</h2><small>{session.user.email}</small></div></div><input className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search..."/>{["dashboard","owners","buildings","units","tenants","contracts","bank automation","payments","utilities"].map(p=><button key={p} onClick={()=>setPage(p)}>{p}</button>)}<button onClick={()=>sb.auth.signOut()}>Logout</button><h4>Portfolio</h4><Portfolio db={db} q={q} setModal={setModal}/></aside><main><header><div><h1>{cap(page)}</h1><small>React Sprint 2.1</small></div><div className="actions">{["owner","building","unit","tenant","payment","utility"].map(t=><button key={t} className={t==="owner"?"primary":""} onClick={()=>setModal({type:t})}>+ {cap(t)}</button>)}</div></header><section className="content">{page==="dashboard"&&<Dashboard db={db} setModal={setModal}/>} {page==="owners"&&<Owners db={db} setModal={setModal}/>} {page==="buildings"&&<Buildings db={db} setModal={setModal}/>} {page==="units"&&<Units db={db} setModal={setModal}/>} {page==="tenants"&&<Tenants db={db} setModal={setModal}/>} {page==="contracts"&&<Contracts db={db} setModal={setModal} reload={load}/>} {page==="bank automation"&&<BankAutomation db={db} reload={load}/>} {page==="payments"&&<Payments db={db} setModal={setModal} reload={load}/>} {page==="utilities"&&<Utilities db={db} setModal={setModal}/>}</section></main>{modal&&<Modal modal={modal} setModal={setModal} db={db} reload={load}/>}</div>
}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function Login(){const[e,setE]=useState(""),[p,setP]=useState(""),[err,setErr]=useState("");async function login(){setErr("");const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)setErr(error.message)}return <div className="login"><div className="login-card"><h1>🏠 Property Manager Pro</h1><p>React Sprint 2.1</p><label>Email<input value={e} onChange={x=>setE(x.target.value)}/></label><label>Password<input type="password" value={p} onChange={x=>setP(x.target.value)}/></label><button className="primary full" onClick={login}>Login</button>{err&&<div className="error">{err}</div>}</div></div>}

function bankTenantSuggestion(db,t){
 if(Number(t.amount||0)<=0)return null;
 const text=[t.counterparty_name,t.counterparty_iban,t.remittance_information].join(" ").toLowerCase();
 const candidates=db.tenants.map(tenant=>{
  let score=0;const name=String(tenant.name||"").toLowerCase();const iban=cleanIban(tenant.iban||"").toLowerCase();
  if(name&&text.includes(name))score+=4;if(iban&&cleanIban(text).includes(iban))score+=6;
  const payments=db.payments.filter(p=>String(p.tenant_id)===String(tenant.id)&&validMonth(p));
  const open=payments.filter(p=>{const paid=db.payment_entries.filter(e=>String(e.payment_id)===String(p.id)).reduce((a,x)=>a+Number(x.amount||0),0);return Number(p.expected_amount||0)+adjustmentNetForPayment(db,p.id)-paid>0.005}).sort((a,b)=>(a.year-b.year)||(a.month-b.month));
  const payment=open[0];if(payment&&Math.abs(Number(t.amount)-Math.max(0,Number(payment.expected_amount||0)+adjustmentNetForPayment(db,payment.id)-db.payment_entries.filter(e=>String(e.payment_id)===String(payment.id)).reduce((a,x)=>a+Number(x.amount||0),0)))<0.01)score+=5;
  return{tenant,payment,score};
 }).sort((a,b)=>b.score-a.score);
 return candidates[0]?.score>=4?candidates[0]:null;
}

function TenantUnitsPicker({db,unitIds,toggle}){
 const[open,setOpen]=useState({});
 const[showOther,setShowOther]=useState(false);

 function toggleBuilding(id){
  setOpen(x=>({...x,[id]:!x[id]}));
 }

 const selectedBuildingIds=db.buildings
  .filter(b=>db.units.some(u=>u.building_id===b.id&&unitIds.includes(u.id)))
  .map(b=>b.id);

 const visibleBuildings=showOther
  ?db.buildings
  :db.buildings.filter(b=>selectedBuildingIds.includes(b.id));

 function BuildingGroup({b}){
  const units=db.units.filter(u=>u.building_id===b.id);
  const selected=units.filter(u=>unitIds.includes(u.id)).length;
  return <div className="building-group" key={b.id}>
   <button type="button" className="building-toggle" onClick={()=>toggleBuilding(b.id)}>
    <span>
     <b>{b.name||"Building"}</b>
     <small>{selected?`${selected} selected`:"No units selected"}</small>
    </span>
    <span>{open[b.id]?"−":"+"}</span>
   </button>
   {open[b.id]&&<div className="building-units">
    {units.length?units.map(u=><label key={u.id} className="unit-option">
     <input type="checkbox" checked={unitIds.includes(u.id)} onChange={()=>toggle(u.id)}/>
     <span>Unit {u.unit_number||""}{u.floor?` · ${u.floor}`:""}</span>
    </label>):<div className="no-units">No units in this building.</div>}
   </div>}
  </div>
 }

 return <div className="unit-picker">
  <div className="unit-picker-title">Units</div>

  {visibleBuildings.length
   ?visibleBuildings.map(b=><BuildingGroup key={b.id} b={b}/>)
   :<div className="no-selected-building">No building selected yet.</div>}

  {db.buildings.length>selectedBuildingIds.length&&
   <button type="button" className="show-other-buildings" onClick={()=>setShowOther(x=>!x)}>
    {showOther?"Hide other buildings":"+ Add units from another building"}
   </button>}
 </div>
}

function latestReading(db,id){return db.meter_readings.filter(x=>String(x.utility_id)===String(id)).sort((a,b)=>String(b.reading_date||"").localeCompare(String(a.reading_date||"")))[0]||null}function previousReading(db,id){return db.meter_readings.filter(x=>String(x.utility_id)===String(id)).sort((a,b)=>String(b.reading_date||"").localeCompare(String(a.reading_date||"")))[1]||null}function estimateUtilityCost(db,utility,latest,prev){if(!latest||!prev)return null;const tariff=db.utility_tariffs.find(x=>String(x.utility_id)===String(utility.id)&&x.active!==false);if(!tariff)return null;const usage=Math.max(0,Number(latest.reading_value)-Number(prev.reading_value));return usage*Number(tariff.unit_price||0)+Number(tariff.fixed_monthly_cost||0)}function utilityIcon(type){return{electricity:"⚡",gas:"🔥",water:"💧",internet:"🌐",heating:"♨️",solar:"☀️",ev_charger:"🔋",lift:"🛗",waste:"🗑️",custom:"🔌"}[type]||"🔌"}function defaultReadingUnit(type){return type==="water"||type==="gas"?"m³":type==="internet"?"GB":"kWh"}
function Field({l,v,set,type="text"}){return <label>{l}<input type={type} value={v||""} onChange={e=>set(e.target.value)}/></label>}
function payloadFor(type,f){if(type==="owner")return{name:f.name||"",email:f.email||"",phone:f.phone||"",address:f.address||"",postal_code:f.postal_code||"",city:f.city||"",country:f.country||"België",notes:f.notes||""};if(type==="building")return{owner_id:f.owner_id||null,name:f.name||"",address:f.address||""};if(type==="unit")return{building_id:f.building_id||null,unit_number:f.unit_number||"",floor:f.floor||""};if(type==="tenant")return{unit_id:null,name:f.name||"",base_rent:Number(f.base_rent||0),additional_costs:Number(f.additional_costs||0),rent:Number(f.base_rent||0)+Number(f.additional_costs||0),phone:f.phone||"",email:f.email||"",iban:formatIban(f.iban||""),active:true};if(type==="payment"){const d=new Date();return{tenant_id:f.tenant_id||null,year:Number(f.year||d.getFullYear()),month:Number(f.month||d.getMonth()+1),expected_amount:Number(f.expected_amount||0),paid_amount:Number(f.paid_amount||0),status:Number(f.paid_amount||0)>0?"partial":"pending"}};if(type==="adjustment")return{tenant_id:f.tenant_id||null,payment_id:f.payment_id||null,adjustment_type:f.adjustment_type||"credit",amount:Number(f.amount||0),adjustment_date:f.adjustment_date||new Date().toISOString().slice(0,10),reason:f.reason||"",notes:f.notes||"",status:f.status||"approved"};if(type==="utility")return{building_id:f.building_id||null,unit_id:f.scope==="unit"?(f.unit_id||null):null,scope:f.scope||"unit",utility_type:f.utility_type||"electricity",custom_name:f.custom_name||"",ean_code:f.ean_code||"",meter_number:f.meter_number||"",provider:f.provider||"",reading_unit:f.reading_unit||defaultReadingUnit(f.utility_type),estimate_cost:Boolean(f.estimate_cost),connected_meter:Boolean(f.connected_meter),connection_type:f.connected_meter?(f.connection_type||"manual"):null,notes:f.notes||""};return f}
function unitsForTenant(db,id){let ids=db.tenant_units.filter(x=>String(x.tenant_id)===String(id)).map(x=>x.unit_id);return db.units.filter(u=>ids.includes(u.id)||String(u.id)===String(db.tenants.find(t=>t.id===id)?.unit_id))}
function tenantsForUnit(db,id){let ids=db.tenant_units.filter(x=>String(x.unit_id)===String(id)).map(x=>x.tenant_id);return db.tenants.filter(t=>ids.includes(t.id)||String(t.unit_id)===String(id))}
function unitLabel(db,u){let b=db.buildings.find(x=>x.id===u.building_id);return `${b?.name||"Building"} - ${u.unit_number||"Unit"}`}
function Card({l,v}){return <div className="card"><small>{l}</small><b>{v}</b></div>}function Panel({title,children}){return <div className="panel"><div className="panel-head"><h3>{title}</h3></div><div className="panel-body">{children}</div></div>}function List({title,add,children}){return <div className="panel"><div className="panel-head"><h3>{title}</h3><button className="primary" onClick={add}>+ Add</button></div>{React.Children.count(children)?children:<div className="empty">Nothing yet.</div>}</div>}function Row({t,s,onClick}){return <div className="row" onClick={onClick}><b>{t}</b><span>{s}</span></div>}function Tile({t,s,onClick}){return <div className="tile" onClick={onClick}><b>{t}</b><br/>{s}</div>}
createRoot(document.getElementById("root")).render(<App/>);
</script>
